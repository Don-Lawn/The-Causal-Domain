<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RR Sphere</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
    </style>
</head>
<body>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>

<script>
// --- Scene setup ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// --- Sphere ---
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(2, 64, 64),
    new THREE.MeshPhongMaterial({
        color: 0x99bbff,
        shininess: 40,
        transparent: true,
        opacity: 0.35
    })
);
scene.add(sphere);

// --- Lighting ---
scene.add(new THREE.PointLight(0xffffff, 1.2, 0).position.set(5,5,5));
scene.add(new THREE.AmbientLight(0x404040));

// --- Function to create a great circle ---
function makeCircle(color) {
    const R = 2;
    const pts = [];
    for (let i = 0; i <= 256; i++) {
        const a = (i / 256) * Math.PI * 2;
        pts.push(new THREE.Vector3(R * Math.cos(a), R * Math.sin(a), 0));
    }
    const geom = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.LineLoop(geom, new THREE.LineBasicMaterial({ color }));
}

// --- Three orthogonal great circles ---
const xy = makeCircle(0x003366);        // XY plane
const xz = makeCircle(0xcc0000); xz.rotation.x = Math.PI/2;
const yz = makeCircle(0x009933); yz.rotation.y = Math.PI/2;

scene.add(xy, xz, yz);

// --- Animation ---
function animate() {
    requestAnimationFrame(animate);
    sphere.rotation.y += 0.003;
    xy.rotation.y += 0.003;
    xz.rotation.y += 0.003;
    yz.rotation.y += 0.003;
    renderer.render(scene, camera);
}
animate();

// --- Resize ---
window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
