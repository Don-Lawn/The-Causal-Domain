<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Sphere</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }
    </style>
</head>
<body>

<!-- Load Three.js FIRST -->
<script src="js/three.min.js"></script>

<!-- Then your own Three.js code -->
<script>
    let phase = 0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
    camera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Sphere
    const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
    const sphereMat = new THREE.MeshLambertMaterial({
        color: 0x3366aa,
        transparent: true,
        opacity: 0.3,
        depthWrite: false
    });

    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphere);

    // Great circle rings
    function makeRing(color, rotation) {
        const geo = new THREE.RingGeometry(0.99, 1.01, 128);
        const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(geo, mat);
        ring.rotation.set(rotation.x, rotation.y, rotation.z);
        return ring;
    }

    scene.add(makeRing(0x00ccff, {x:0, y:0, z:0}));          // XY
    scene.add(makeRing(0xff8800, {x:Math.PI/2, y:0, z:0}));  // XZ
    scene.add(makeRing(0x00ff88, {x:0, y:Math.PI/2, z:0}));  // YZ

    
    // Big phase disk (planetary rings style)
    const diskGeo = new THREE.CircleGeometry(1.0, 64);
    const diskMat = new THREE.MeshBasicMaterial({
        color: 0xff44ff,
        transparent: true,
        opacity: 0.3,
        side: THREE.DoubleSide,
        depthTest: false
    });

    const phaseDisk = new THREE.Group();

    function makeQuad(color, startAngle) {
        const geo = new THREE.CircleGeometry(1, 64, startAngle, Math.PI / 2);
        const mat = new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide
        });
        return new THREE.Mesh(geo, mat);
    }

    // Quadrants (0°, 90°, 180°, 270°)
    phaseDisk.add(makeQuad(0xff0000, 0));              // red
    phaseDisk.add(makeQuad(0x00ff00, Math.PI / 2));    // green
    phaseDisk.add(makeQuad(0xff0000, Math.PI));        // red
    phaseDisk.add(makeQuad(0x00ff00, 3 * Math.PI / 2));// green

    // Rotate into XZ plane (same as orange ring)
    phaseDisk.rotation.x = Math.PI / 2;

    scene.add(phaseDisk);


    // Phase arrow group
    const totalLength = 1;
    const coneHeight = 0.2;
    const shaftLength = totalLength - coneHeight;

    const phaseArrow = new THREE.Group();

    // Shaft
    const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, shaftLength, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );

    // Move shaft so its base is at the origin
    shaft.position.y = shaftLength / 2;

    // Arrowhead
    const head = new THREE.Mesh(
        new THREE.ConeGeometry(0.06, coneHeight, 16),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );

    // Move head to the tip
    head.position.y = shaftLength + coneHeight / 2;

    // Add both to the group
    phaseArrow.add(shaft);
    phaseArrow.add(head);

    // Rotate arrow into XZ plane (same as orange ring)
    phaseArrow.rotation.z = Math.PI / 2;

    // Add to scene
    scene.add(phaseArrow);

    const qTotal = -1.0;       // slightly longer than radius for clarity
    const qCone = -0.2;
    const qShaft = qTotal - qCone;

    const qAxis = new THREE.Group();

    // Shaft
    const qShaftMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, qShaft, 16),
        new THREE.MeshBasicMaterial({ color: 0x0080ff })
    );
    qShaftMesh.position.y = qShaft / 2;

    // Arrowhead
    const qHead = new THREE.Mesh(
        new THREE.ConeGeometry(0.06, qCone, 16),
        new THREE.MeshBasicMaterial({ color: 0x0080ff })
    );
    qHead.position.y = qShaft + qCone / 2;

    // Add to group
    qAxis.add(qShaftMesh);
    qAxis.add(qHead);

    // No rotation needed — Q is vertical
    scene.add(qAxis);


        // Z-axis dashed line
    const zMat = new THREE.LineDashedMaterial({
        color: 0x00ffff,       // cyan for visibility
        dashSize: 0.05,
        gapSize: 0.05,
        transparent: true,
        opacity: 0.4,
        dashOffset: -.1,
        depthTest: false
    });

    const zGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, -1.4, 0),
        new THREE.Vector3(0, 1.4, 0)
    ]);

    const zLine = new THREE.Line(zGeo, zMat);
    zLine.computeLineDistances(); // required for dashed lines
    scene.add(zLine);


    // Set tilt ONCE
    scene.rotation.x = 0.4;



    // Light
//    const light = new THREE.PointLight(0xffffff, 1);
//    light.position.set(5,5,5);
//    scene.add(light);
    const ambient = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambient);

    function animate() {
        requestAnimationFrame(animate);
        phase += 0.05;   // adjust speed as you like
        phaseArrow.rotation.y = -phase;
        scene.rotation.y += 0.001;
        // walking ants
        zMat.dashOffset -= 0.01;   // small, steady motion
        // no needsUpdate needed

        renderer.render(scene, camera);
    }
    animate();
</script>

</body>
</html>
